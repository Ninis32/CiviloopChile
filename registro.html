<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - CiviLoop Chile</title>

<link rel="stylesheet" href="css/style.css">
<!-- 1. Librería oficial de Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<div class="auth-container">

    <div class="logo">
        ♻️
    </div>

    <h1>CiviLoop <span>Chile</span></h1>

    <p class="subtitulo">
        Crea tu cuenta y comienza a reciclar
    </p>

    <div class="tabs">
        <button type="button" onclick="window.location='index.html'">
            Iniciar sesión
        </button>

        <button type="button" class="activo">
            Registrarse
        </button>
    </div>

    <form id="registroForm">

        <label>Nombre completo</label>
        <input
            type="text" id="nombre"
            placeholder="Ej: Juan Pérez"
        >

        <label>Correo electrónico</label>
        <input
            type="email" id="correo"
            placeholder="tu@correo.cl"
        >

        <label>Contraseña</label>
        <input
            type="password" id="password"
            placeholder="********"
        >

        <label>Confirmar contraseña</label>
        <input
            type="password" id="confirmar_password"
            placeholder="********"
        >

        <label>Región</label>
        <select id="region">
            <option value="">Selecciona una región</option>
            <option>Región Metropolitana</option>
            <option>Valparaíso</option>
            <option>Biobío</option>
            <option>La Araucanía</option>
            <option>Los Lagos</option>
        </select>

        <button type="submit" class="btn-login">
            Crear Cuenta
        </button>

    </form>

    <!-- Separador visual -->
    <div style="margin: 15px 0; text-align: center; color: #888;">o</div>

    <!-- 2. Botón oficial de Google -->
    <div style="display: flex; justify-content: center; margin-bottom: 10px;">
        <div id="g_id_onload"
             data-client_id="327987732884-qvqrhs0lo19k47m82ss6n5r630o598ob.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" 
             data-type="standard" 
             data-size="large" 
             data-theme="outline" 
             data-text="signup_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
    </div>

</div>

<script src="script.js"></script>

<!-- 3. Manejador de respuesta de Google -->
<script>
async function handleCredentialResponse(response) {
  try {
    const res = await fetch("/api/auth/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ credential: response.credential })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("usuario", JSON.stringify(data.usuario));
      alert("¡Registro exitoso! Bienvenido/a " + data.usuario.nombre);
      window.location.href = "index.html";
    } else {
      alert("Error: " + data.mensaje);
    }
  } catch (err) {
    console.error("Error al autenticar:", err);
    alert("Error de conexión con el servidor");
  }
}
</script>

</body>
</html>
