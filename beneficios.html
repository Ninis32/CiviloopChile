<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beneficios – CiviLoop Chile</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">

  <!-- Librería para la animación de confeti/cotillón -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="auth-container">

  <div class="logo">🎁</div>
  <h1>CiviLoop <span>Chile</span></h1>
  <p class="subtitulo">Beneficios disponibles</p>

  <div class="puntos-box">
    <h2 id="mis-puntos">— Puntos Disponibles</h2>
  </div>

  <!-- 1. CONTENEDOR DONDE SE MUESTRA EL CÓDIGO QR -->
  <div id="contenedorCanje"></div>

  <div id="lista-beneficios">
    <p style="color:#888;font-size:0.85rem">Cargando beneficios...</p>
  </div>

  <a href="dashboard.html" style="margin-top:1rem;display:block;text-align:center;color:#2E8B57;font-size:0.85rem">
    ← Volver al inicio
  </a>

</div>

<!-- Toast de notificación -->
<div id="toast" style="display:none;position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  background:#1A5C35;color:white;padding:0.6rem 1.4rem;border-radius:20px;font-size:0.85rem;z-index:999">
</div>

<script>
  const token   = localStorage.getItem("token")
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null")
  if (!token || !usuario) window.location.href = "index.html"

  document.getElementById("mis-puntos").textContent = usuario.puntos_totales + " Puntos Disponibles"

  // Refrescar puntos reales desde el servidor
  async function actualizarPuntos() {
    try {
      const res  = await fetch("https://civiloopchile.onrender.com/perfil", {
        headers: { "Authorization": "Bearer " + token }
      })
      const data = await res.json()
      if (res.ok) {
        usuario.puntos_totales = data.puntos_totales
        localStorage.setItem("usuario", JSON.stringify(usuario))
        document.getElementById("mis-puntos").textContent = usuario.puntos_totales + " Puntos Disponibles"
      }
    } catch {}
  }

  // Cargar beneficios desde MongoDB
  async function cargarBeneficios() {
    try {
      const res  = await fetch("https://civiloopchile.onrender.com/api/beneficios", {
        headers: { "Authorization": "Bearer " + token }
      })
      const data = await res.json()

      if (!res.ok) throw new Error(data.mensaje)

      const contenedor = document.getElementById("lista-beneficios")

      if (data.length === 0) {
        contenedor.innerHTML = "<p style='color:#888;font-size:0.85rem'>No hay beneficios disponibles por ahora.</p>"
        return
      }

      contenedor.innerHTML = data.map(b => {
        const puedeCanjear = usuario.puntos_totales >= b.puntos_requeridos && b.stock > 0
        return `
          <div class="beneficio">
            <h3>${b.titulo || b.descripcion}</h3>
            <p>${b.descripcion}</p>
            <p style="color:#2E8B57;font-weight:600">${b.puntos_requeridos} puntos</p>
            <p style="font-size:0.75rem;color:#aaa">Stock: ${b.stock} disponibles</p>
            <button
              onclick="canjear('${b._id}', ${b.puntos_requeridos})"
              ${puedeCanjear ? "" : "disabled"}
              style="${puedeCanjear ? "" : "opacity:0.4;cursor:not-allowed"}">
              ${puedeCanjear ? "Canjear" : "Puntos insuficientes"}
            </button>
          </div>
        `
      }).join("")

    } catch (err) {
      document.getElementById("lista-beneficios").innerHTML =
        "<p style='color:#888;font-size:0.85rem'>Error al cargar beneficios.</p>"
    }
  }

  // Canjear un beneficio
  async function canjear(id_beneficio, puntos) {
    if (!confirm(`¿Canjear por ${puntos} puntos?`)) return

    try {
      const res  = await fetch("https://civiloopchile.onrender.com/api/canjes", {
        method:  "POST",
        headers: {
          "Content-Type":  "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ id_beneficio })
      })
      const data = await res.json()

      if (res.ok) {
        // 🚀 Disparar cotillón / confeti
        if (typeof confetti === "function") {
          confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 }
          });
        }

        // 2. DESPLEGAR LA TARJETA DEL CÓDIGO QR GENERADO
        document.getElementById("contenedorCanje").innerHTML = `
          <div style="text-align: center; background: #f4fbf6; border: 1px solid #1A5C35; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <h3 style="color: #1A5C35; margin-bottom: 5px;">¡Cupón Generado! 🎉</h3>
            <p style="font-size: 0.8rem; color: #555; margin-bottom: 10px;">Muestra este código QR en el local:</p>
            <img src="${data.qr_image}" alt="Código QR de Descuento" style="border: 2px solid #1A5C35; border-radius: 8px; max-width: 180px;" />
            <p style="margin-top: 10px; font-size: 0.9rem;">Código: <strong>${data.codigo_cupon}</strong></p>
          </div>
        `;

        // Actualizar puntos en localStorage
        usuario.puntos_totales -= puntos
        localStorage.setItem("usuario", JSON.stringify(usuario))
        document.getElementById("mis-puntos").textContent = usuario.puntos_totales + " Puntos Disponibles"
        mostrarToast("✓ " + data.mensaje)
        cargarBeneficios() // recargar lista
      } else {
        mostrarToast("✗ " + data.mensaje)
      }
    } catch {
      mostrarToast("✗ Error de conexión")
    }
  }

  function mostrarToast(msg) {
    const t = document.getElementById("toast")
    t.textContent = msg
    t.style.display = "block"
    setTimeout(() => t.style.display = "none", 3000)
  }

  async function iniciar() {
    await actualizarPuntos()
    cargarBeneficios()
  }
  iniciar()
</script>
</body>
</html>
